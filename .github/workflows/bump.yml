name: bump

on:
  workflow_dispatch:
    inputs:
      level:
        description: '`patch` finalizes a prerelease or bumps a stable patch; `beta` bumps the beta prerelease'
        type: choice
        options: [patch, minor, beta]
        default: patch

concurrency:
  group: bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    # Releases only ship from main; a stray dispatch from a feature branch would publish unmerged code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Pushes made with GITHUB_TOKEN trigger no workflows. The app token's tag push is what
      # starts release.yml.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
      - name: Bump, commit, and tag
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          case "$LEVEL" in
            beta) npm version prerelease --preid beta -m 'chore(release): v%s' ;;
            *) npm version "$LEVEL" -m 'chore(release): v%s' ;;
          esac
          echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      # Atomic: a rejected branch push also drops the tag, so release.yml never builds an orphan tag.
      - run: git push --atomic origin HEAD "$TAG"
